<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanaBuddy &mdash; Study Guide</title>
    <link rel="icon" type="image/png" href="img/kanami.png">
    <link rel="apple-touch-icon" href="img/kanami.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Kosugi+Maru&family=Kaisei+Decol:wght@400;700&family=Yuji+Syuku&family=Klee+One:wght@400;600&family=Hachi+Maru+Pop&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img class="logo-slot" src="img/kanami.png" alt="" width="40" height="40">
            <span>KanaBuddy</span>
        </a>
        <nav>
            <a href="study.html">Study</a>
            <a href="quiz.html">Quiz</a>
        </nav>
    </header>

    <main class="page">
        <section class="study-intro">
            <h1>Kana Study Guide</h1>
            <p>
                A reference for hiragana and katakana in gojūon order. Click on each character to show or hide the romanji.
            </p>
            <div class="study-controls">
                <div class="study-control">
                    <span class="study-font-label">Font</span>
                    <div class="font-dropdown" id="font-dropdown">
                        <button type="button" class="font-dropdown-toggle" id="font-toggle"
                                aria-haspopup="listbox" aria-expanded="false">
                            <span class="font-toggle-label" id="font-toggle-label">Sans (Gothic)</span>
                            <span class="font-toggle-caret" aria-hidden="true">▾</span>
                        </button>
                        <div class="font-options" id="font-options" role="listbox" hidden>
                            <!-- font radios injected before this random option -->
                            <label class="font-choice" id="random-choice">
                                <input type="radio" name="font" value="random">
                                <span class="font-info">
                                    <span class="font-name">Randomize</span>
                                    <span class="font-note">a random font per kana</span>
                                </span>
                                <span class="font-sample" id="random-sample"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="study-romaji-buttons">
                    <button type="button" class="btn btn-ghost" id="reset-romaji-btn">Show Romaji</button>
                    <button type="button" class="btn btn-ghost" id="hide-romaji-btn">Hide Romaji</button>
                </div>
            </div>
            <div class="study-tabs" id="study-tabs" role="tablist"></div>
        </section>

        <div id="study-content"></div>
    </main>

    <footer class="site-footer">
        <a href="https://github.com/btemplep/kanabuddy/blob/main/CHANGELOG.md"
           class="version-link" data-app-version>v0.0.0</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="https://github.com/btemplep/kanabuddy" class="footer-link">Source</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span class="footer-copyright">© 2026 Brandon Temple Paul</span>
    </footer>

    <script src="js/version.js"></script>
    <script src="js/kana-data.js"></script>
    <script src="js/font-dropdown.js"></script>
    <script src="js/study.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
